# Builds 我的心愿单.exe, the window launcher in desktop/, and publishes it as the "app-latest" release.
name: Build Windows app

on:
  push:
    branches: [main]
    paths: ['desktop/**', 'apple-touch-icon.png', '.github/workflows/windows-app.yml']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-app
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install build tools
        run: python -m pip install pyinstaller pillow pystray
      - name: Run tests
        run: python -m unittest tests.test_desktop
      - name: Make the icon
        run: python -c "from PIL import Image; Image.open('apple-touch-icon.png').save('wishlist.ico', sizes=[(16,16),(32,32),(48,48),(64,64),(128,128),(256,256)])"
      - name: Build
        run: pyinstaller --noconfirm --clean --onefile --windowed --name MyCollections --icon wishlist.ico --add-data "apple-touch-icon.png;." desktop/wishlist_app.py
      - name: Check the tray starts and a second copy leaves it alone
        shell: pwsh
        run: |
          $app = Start-Process dist\MyCollections.exe -PassThru -ArgumentList '--minimized'
          Start-Sleep 6
          if ($app.HasExited) { throw "Tray app exited with code $($app.ExitCode)" }
          $second = Start-Process dist\MyCollections.exe -PassThru -ArgumentList '--minimized'
          if (-not $second.WaitForExit(15000)) { throw 'A second copy did not leave' }
          Stop-Process $app -Force
      - name: Package
        shell: pwsh
        run: |
          Rename-Item dist\MyCollections.exe 我的心愿单.exe
          Compress-Archive -Path dist\我的心愿单.exe -DestinationPath MyCollections-windows.zip
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release delete app-latest --yes --cleanup-tag 2>$null
          gh release create app-latest MyCollections-windows.zip --target $env:GITHUB_SHA --title "我的心愿单 Windows 版（最新）" --notes "解压后双击「我的心愿单.exe」，心愿单会在单独的窗口里打开。构建自 $env:GITHUB_SHA。"
